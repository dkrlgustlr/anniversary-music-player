<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#120d0e" />
    <meta name="description" content="1주년을 위한 모바일 음악 플레이어" />
    <meta property="og:title" content="Happy Anniversary" />
    <meta property="og:description" content="1st Anniversary · Rap / Hip-hop" />
    <meta property="og:image" content="./images/anniversary-main.png?v=2" />
    <title>Happy Anniversary | Music Player</title>
    <link rel="preload" href="./images/anniversary-main.png?v=2" as="image" />
    <link rel="stylesheet" href="./styles.css?v=6" />
    <script src="./script.js?v=6" defer></script>
  </head>
  <body>
    <main class="site-frame">
      <div class="ambient-background" aria-hidden="true"></div>
      <div class="ambient-overlay" aria-hidden="true"></div>

      <section class="player-stage" aria-label="기념일 음악 플레이어">
        <article class="music-shell" id="musicShell" data-playing="false">
          <div class="hero-frame">
            <img
              src="./images/anniversary-main.png?v=2"
              alt="Happy Anniversary 풍선과 케이크가 놓인 기념일 파티"
            />
            <div class="hero-shade" aria-hidden="true"></div>
          </div>

          <div class="player-panel">
            <header class="player-heading">
              <div>
                <p class="eyebrow">NOW PLAYING</p>
                <p class="edition-label" id="editionLabel">ANNIVERSARY EDIT</p>
              </div>
              <svg class="heart-icon" viewBox="0 0 24 24" aria-label="기념일 트랙">
                <path d="M12 21s-7.5-4.35-9.55-8.17C.8 9.76 2.03 5.8 5.45 4.54 7.4 3.82 9.5 4.4 12 6.92c2.5-2.52 4.6-3.1 6.55-2.38 3.42 1.26 4.65 5.22 3 8.29C19.5 16.65 12 21 12 21Z" />
              </svg>
            </header>

            <div class="track-row">
              <div class="album-art" aria-hidden="true">
                <img src="./images/anniversary-main.png?v=2" alt="" />
              </div>
              <div class="track-copy">
                <h1 id="trackTitle">Happy Anniversary</h1>
                <p id="trackSubtitle">1st Anniversary · Rap / Hip-hop</p>
              </div>
            </div>

            <div class="waveform" id="waveform" data-playing="false" aria-hidden="true"></div>

            <div class="timeline">
              <label class="sr-only" for="progress">재생 위치</label>
              <input
                id="progress"
                class="progress"
                type="range"
                min="0"
                max="170.48"
                step="0.1"
                value="0"
                aria-valuetext="00:00 / 02:50"
              />
              <div class="time-row" aria-hidden="true">
                <span id="currentTime">00:00</span>
                <span id="duration">02:50</span>
              </div>
            </div>

            <div class="main-controls">
              <button class="icon-button" id="backButton" type="button" aria-label="10초 뒤로">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M3 12a9 9 0 1 0 3-6.7L3 8" />
                  <path d="M3 3v5h5" />
                  <path d="M9.5 10.2v4" />
                  <path d="M13 11.1c.4-.7 1.2-1.1 2-1.1 1.3 0 2.3 1 2.3 2.2v.6A2.3 2.3 0 0 1 15 15c-1.3 0-2.3-1-2.3-2.2v-.6c0-.4.1-.8.3-1.1Z" />
                </svg>
              </button>

              <div class="play-control">
                <button class="play-button" id="playButton" type="button" aria-label="재생" data-state="paused">
                  <svg id="playIcon" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="m8 5 11 7-11 7V5Z" />
                  </svg>
                  <svg id="pauseIcon" viewBox="0 0 24 24" aria-hidden="true" hidden>
                    <rect x="6" y="5" width="4" height="14" rx="1"></rect>
                    <rect x="14" y="5" width="4" height="14" rx="1"></rect>
                  </svg>
                </button>
                <span class="play-mode-label" id="playModeLabel">재생</span>
              </div>

              <button class="icon-button" id="forwardButton" type="button" aria-label="10초 앞으로">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M21 12a9 9 0 1 1-3-6.7L21 8" />
                  <path d="M21 3v5h-5" />
                  <path d="M7 10.2v4" />
                  <path d="M10.5 11.1c.4-.7 1.2-1.1 2-1.1 1.3 0 2.3 1 2.3 2.2v.6A2.3 2.3 0 0 1 12.5 15c-1.3 0-2.3-1-2.3-2.2v-.6c0-.4.1-.8.3-1.1Z" />
                </svg>
              </button>
            </div>

            <div class="utility-row">
              <p class="sr-only" id="playerStatus" aria-live="polite">재생 준비됨</p>
              <button class="volume-button" id="volumeButton" type="button" aria-label="음소거" aria-pressed="false">
                <svg id="volumeIcon" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M11 5 6 9H3v6h3l5 4V5Z" />
                  <path d="M15 9.5a4 4 0 0 1 0 5M17.8 6.8a7.5 7.5 0 0 1 0 10.4" />
                </svg>
                <svg id="mutedIcon" viewBox="0 0 24 24" aria-hidden="true" hidden>
                  <path d="M11 5 6 9H3v6h3l5 4V5Z" />
                  <path d="m16 9 5 5M21 9l-5 5" />
                </svg>
              </button>
            </div>

            <audio id="audio" preload="metadata">
              <source src="./audio/anniversary-rap.mp3" type="audio/mpeg" />
            </audio>
            <noscript>음악을 재생하려면 브라우저에서 JavaScript를 켜주세요.</noscript>
          </div>
        </article>
      </section>
    </main>
  </body>
</html>
